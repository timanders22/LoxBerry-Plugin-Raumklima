[AUTHOR]
NAME=Raumklima Plugin Authors
EMAIL=raumklima@users.noreply.github.com

[PLUGIN]
VERSION=0.9.5
NAME=raumklima
FOLDER=raumklima
TITLE=Raumklima

[AUTOUPDATE]
# Das eigene Repository steht, deshalb ist Auto-Update an. Solange es nicht
# stand, war es bewusst aus: eine Adresse, die ins Leere zeigt, waere
# schlimmer als keine. LoxBerry vergleicht Fassungen als Zahl, und ein
# fremdes 2021.05.14 waere groesser als 0.9.1 - daraus wuerde ein stilles
# Downgrade auf ein voellig anderes Plugin.
#
# Bei jedem Release: VERSION hier UND in release.cfg erhoehen, beide
# Adressen dort auf den neuen Tag setzen, das Release mit genau diesem Tag
# anlegen - und danach nachpruefen, dass der Tag wirklich existiert.
#
# Ohne die beiden Adressen unten waere AUTOMATIC_UPDATES=true wirkungslos:
# LoxBerry wuesste nicht, WO es nachsehen soll. Beide zeigen auf den Zweig
# master des EIGENEN Repositoriums - nie auf ein fremdes. LoxBerry vergleicht
# Fassungen als Zahl, und ein fremdes 2021.05.14 waere groesser als 0.9.1;
# daraus wuerde ein stilles Downgrade auf ein voellig anderes Plugin
# (Hausregel, belegt am Docker-Plugin).
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Raumklima/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Raumklima/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Mindestens 3.0.0: das Plugin liest config/system/general.json. Mit 2.0
# liesse es sich installieren und liefe dann nicht.
LB_MINIMUM=3.0.0
# Keine Obergrenze. plugininstall.pl ruft bei Ueberschreitung &fail() - die
# Installation wird abgebrochen, nicht nur gewarnt.
LB_MAXIMUM=false
# SYSTEM.ARCHITECTURE wird von plugininstall.pl gelesen und danach nie
# benutzt. Eine Angabe verhindert also nichts, waere aber eine unwahre
# Aussage - das Plugin ist reines PHP und laeuft ueberall.
ARCHITECTURE=false
