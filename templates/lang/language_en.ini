SP_BEDEUTUNG = "Meaning"
RAUMN_HILFE = "<span class='sm-mono'>raumN</span> stands for the room's sequence number, i.e. <span class='sm-mono'>raum1</span>, <span class='sm-mono'>raum2</span> and so on – in the order of the filled-in rows. Values that do not exist are <b>not</b> sent; a 0 would be a false statement."
