ZU_FREIGABE = "Only this AND actually drives the window. The recommendation alone is not enough — a hard lock for rain, storm or imminent condensation on the cold surface must <b>not</b> be present at the same time."
ZU_ZAEHLER = "A timestamp alone is not enough as a sign of life: a Raspberry without a buffered clock jumps at the first time sync, and any age computed from it is useless afterwards. A wrapping counter is not."
ANSAGE_KEIN_BAUSTEIN = "Speech output (Settings tab, off by default): the plugin speaks the announcements “ventilation recommended” and “risk of mould” itself, when the state begins. No new block is needed for this."
