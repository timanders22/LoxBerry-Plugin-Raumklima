SP_RAUM = "Room"
SP_PRAEFIX = "Prefix in the search text"
KEINE_RAEUME_KURZ = "no room set up yet"
H_S4 = "Step 4: detecting failure"
S4 = "<b>A virtual input keeps its last value.</b> If the plugin or a sensor source goes quiet, the app still shows the last number and everything looks normal. That is why the plugin delivers three values that make it visible: <span class='sm-mono'>ALTER</span> (seconds since the last successful reading), <span class='sm-mono'>R&lt;n&gt;RALTER</span> (seconds since this room’s last valid reading) and <span class='sm-mono'>R&lt;n&gt;STEHT</span> (the reading no longer moves). <span class='sm-mono'>OK</span> is <b>1</b> as soon as at least one room delivers readings and the last successful reading is no older than three times the fetch interval, otherwise 0 – it is a flag, not a counter. <span class='sm-mono'>NOHNE</span> says how many rooms are without readings. The blocks for it are below."
H_S5 = "Step 5: the blocks, to rebuild"
S5 = "Work through it top to bottom: first the inputs from the import file, then the blocks. The block search in Loxone Config opens with <b>F5</b>."
BAUSTEINE_FUER = "Built for the room „%s“ (number %d). The numbers in the „Connect inputs to“ column refer to the rows of this table."
