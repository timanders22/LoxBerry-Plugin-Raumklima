[EINST]
H_LAGE = "Current situation"
LAGE_ERKLAERUNG = "The table shows, for each room, what was measured, what follows from it and whether airing out pays off. What matters is <b>absolute</b> humidity in grams per cubic metre, not relative humidity: cold outdoor air at 90 % is drier than warm indoor air at 50 %, and anyone airing by relative humidity gets it exactly backwards in winter."
H_TABELLE = "The rooms"
TABELLE_HINWEIS = "The „coldest surface“ column is an <b>estimate</b> derived from the fRsi factor, not a measurement. Mould grows from 80 % relative humidity at the surface – long before any water becomes visible."
NOCH_NICHTS = "No readings yet. Enter at least one room below, then press „Fetch now“."
K_ABRUFEN = "Fetch and calculate now"
H_QUELLEN = "Where the readings come from"
QUELLEN_ERKLAERUNG = "This plugin knows no particular sensor brand – it accepts <b>any address that returns JSON</b>. That may be an Ecowitt or Shelly device on your network, the endpoint of another LoxBerry plugin, or a file you generate yourself. If a single response contains all rooms, enter the address above and only the two paths per room."
QUELLE = "Shared address"
QUELLE_HILFE = "Used wherever the table has no address of its own. It is fetched <b>once</b> per cycle, not once per room."
RAUM = "Room"
NAME = "Name"
PFAD_T = "Path to temperature"
PFAD_RF = "Path to humidity"
EIGENE_QUELLE = "own address"
SOLL_MIN = "Target from %"
SOLL_MAX = "Target to %"
TABELLE_FELDER = "<b>Path:</b> levels separated by dots, for example <span class='sm-mono'>ch_aisle.0.temp</span>. On the Test tab, „Check sources“ tells you which keys actually exist at that point. — <b>fRsi</b> describes how cold the coldest spot in the room gets: 1.0 means as warm as the room air, 0.4 almost as cold as outside. DIN 4108-2 requires at least 0.70 in new buildings; an uninsulated external corner in an older building is below that. If you do not know, leave 0.70. — <b>Target from/to</b> is the humidity range the room should stay in; 0 switches the message off."
H_ZUGANG = "Credentials, if the source requires them"
ZUG_BENUTZER = "User name"
ZUG_PASSWORT = "Password"
ZUG_HILFE = "Sent as HTTP basic authentication. Stored in a separate file with permissions 0600, not in the configuration. Currently %d characters are stored. Leaving the field empty means <b>unchanged</b>."
ZUG_LOESCHEN = "Delete credentials"
H_AUSSEN = "The outdoor air"
AUSSEN_ERKLAERUNG = "Without outdoor values nobody can say whether airing helps. <b>Open-Meteo</b> supplies them free of charge, without an account – and with a <b>forecast</b>. That is what makes the difference: the question is not only whether it pays off now, but whether it is worth waiting."
AUSSEN_ART = "Source"
ART_METEO = "Open-Meteo (with forecast, recommended)"
ART_EIGEN = "own weather station (present moment only)"
BREITE = "Latitude"
LAENGE = "Longitude"
ORT_HILFE = "Four decimal places are more than enough. Any map application will give you the values."
AUSSEN_QUELLE = "Address of your own station"
AUSSEN_T = "Path to outdoor temperature"
AUSSEN_RF = "Path to outdoor humidity"
AUSSEN_EIGEN_HILFE = "Only needed if „own weather station“ is selected above. In that case there is <b>no forecast</b>, and therefore no statement about whether waiting would pay off."
H_BEWERTUNG = "When airing is recommended"
BEWERTUNG_ERKLAERUNG = "Three conditions must come together: it is drier outside in absolute terms, it is not too cold, and the room is not already too dry."
MINDEST = "Minimum difference in g/m³"
MINDEST_HILFE = "Smaller differences do not count. Without this margin the recommendation flips back and forth with every bit of measurement noise. 0.5 is a good starting point."
T_MIN = "Do not air below ... °C"
T_MIN_HILFE = "In hard frost airing does work, but it costs a lot of heating energy. Where that limit lies is your decision."
AF_UNTER = "Too dry below ... g/m³"
AF_UNTER_HILFE = "If the room air is below this, airing is no longer recommended – in winter, air that is too dry is the more common problem, and airing makes it drier still. 0 switches this off. For orientation: 20 °C at 40 % is about 6.9 g/m³."
VORSCHAU = "Look-ahead in hours"
TAKT = "Interval between fetches (seconds)"
TAKT_HILFE = "Indoor climate changes slowly. 300 seconds is plenty; shorter intervals only burden the sources."

[MQTT]
ERKLAERUNG = "Since LoxBerry 3 the MQTT Gateway is a system component. The plugin sends its values to the gateway's UDP input and therefore needs <b>no</b> broker credentials. The values then appear under the configured topic and can be used in Loxone via the MQTT input."
NICHT_GEFUNDEN = "No MQTT section can be found in the system configuration. The gateway has probably never been set up."
