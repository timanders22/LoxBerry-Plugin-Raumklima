[EINST]
AF_UNTER = "Too dry below ... g/m³"
AF_UNTER_HILFE = "If the room air is below this, airing is no longer recommended – in winter, air that is too dry is the more common problem, and airing makes it drier still. 0 switches this off. For orientation: 20 °C at 40 % is about 6.9 g/m³."
ART = "Type"
ART_AUSSEN = "External wall"
ART_EIGEN = "own weather station (present moment only)"
ART_HILFE = "The <b>type</b> decides where the coldest surface takes its temperature from. <b>External wall</b> uses fRsi and the outdoor air – which only holds while you are heating. <b>Cellar / ground</b> uses the temperature of the soil next to it instead, usually 12 to 14 °C; that is exactly where summer mould appears, when warm humid air meets the cool wall. <b>Interior room</b> makes no mould statement at all rather than an invented one."
ART_INNEN = "Interior room"
ART_KELLER = "Cellar / ground"
ART_METEO = "Open-Meteo (with forecast, recommended)"
AUSSEN_ART = "Source"
AUSSEN_EIGEN_HILFE = "Only needed if „own weather station“ is selected above. In that case there is <b>no forecast</b>, and therefore no statement about whether waiting would pay off."
AUSSEN_ERKLAERUNG = "Without outdoor values nobody can say whether airing helps. <b>Open-Meteo</b> supplies them free of charge, without an account – and with a <b>forecast</b>. That is what makes the difference: the question is not only whether it pays off now, but whether it is worth waiting."
AUSSEN_QUELLE = "Address of your own station"
AUSSEN_RF = "Path to outdoor humidity"
AUSSEN_T = "Path to outdoor temperature"
BEWERTUNG_ERKLAERUNG = "Three conditions must come together: it is drier outside in absolute terms, it is not too cold, and the room is not already too dry."
BREITE = "Latitude"
CO2_MAX = "CO₂ ppm"
DAUER_MIN = "Recommendation lasts at least (minutes)"
DAUER_MIN_HILFE = "Once given, the recommendation stands for this long, even if the condition just barely stopped holding. A window drive should not switch every five minutes. 0 turns the run-on off; heavy rain always cancels it."
EIGENE_QUELLE = "own address"
EINHEIT = "Units"
EINHEIT_HILFE = "Only needed if the source does not deliver degrees Celsius and percent. Ecowitt devices may be set to Fahrenheit, and some gateways report humidity as a fraction between 0 and 1. Text after the number – such as „52%“ or „24.6 C“ – is understood either way."
ERD_T = "Ground °C"
FENSTERART = "Window"
F_KIPP = "tilted"
F_QUER = "cross draught"
F_STOSS = "wide open"
HYST = "Switch-off share"
HYST_HILFE = "Switching on happens at the minimum difference above, switching off only at this share of it. 0.5 means: on at 0.5 g/m³, off only below 0.25 g/m³. Without that gap the recommendation flips on measurement noise – 0.4 percentage points of outdoor humidity were enough, and the fetch runs every five minutes. 1 turns the hysteresis off."
H_AUSSEN = "The outdoor air"
H_BEWERTUNG = "When airing is recommended"
H_EIGENSCHAFTEN = "Properties per room"
H_LAGE = "Current situation"
H_QUELLEN = "Where the readings come from"
H_SICHERUNG = "Back up and restore settings"
H_TABELLE = "The rooms"
H_ZUGANG = "Credentials, if the source requires them"
KUEHL_SPANNE = "Cooling counts from (kelvin)"
KUEHL_SPANNE_HILFE = "How much colder it has to be outside before airing counts as cooling. Only applies to rooms with a target temperature."
K_ABRUFEN = "Fetch and calculate now"
K_SICHERN = "Back up settings"
K_ZURUECK = "Restore settings"
LAENGE = "Longitude"
LAGE_ERKLAERUNG = "The table shows, for each room, what was measured, what follows from it and whether airing out pays off. What matters is <b>absolute</b> humidity in grams per cubic metre, not relative humidity: cold outdoor air at 90 % is drier than warm indoor air at 50 %, and anyone airing by relative humidity gets it exactly backwards in winter."
MINDEST = "Minimum difference in g/m³"
MINDEST_HILFE = "Smaller differences do not count. Without this margin the recommendation flips back and forth with every bit of measurement noise. 0.5 is a good starting point."
NAME = "Name"
NOCH_NICHTS = "No readings yet. Enter at least one room below, then press „Fetch now“."
ORT_HILFE = "Four decimal places are more than enough. Any map application will give you the values. Both fields empty means: no weather data is fetched."
PFAD_CO2 = "CO₂ path"
PFAD_FENSTER = "Window contact path"
PFAD_RF = "Path to humidity"
PFAD_T = "Path to temperature"
QUELLE = "Shared address"
QUELLEN_ERKLAERUNG = "This plugin knows no particular sensor brand – it accepts <b>any address that returns JSON</b>. That may be an Ecowitt or Shelly device on your network, the endpoint of another LoxBerry plugin, or a file you generate yourself. If a single response contains all rooms, enter the address above and only the two paths per room."
QUELLE_HILFE = "Used wherever the table has no address of its own. It is fetched <b>once</b> per cycle, not once per room."
RAUM = "Room"
REGEN_MAX = "Rain at most (mm/h)"
REGEN_MAX_HILFE = "If the forecast for the current hour predicts more precipitation than this, airing is not recommended – not even for CO₂. The figure comes from the same Open-Meteo request as temperature and humidity, so it costs nothing. 0 turns the block off."
SICH_ABGELEHNT = "The file was NOT accepted — nothing has been changed:"
SICH_ERKLAERUNG = "For <b>moving to a second LoxBerry</b>: the file contains all settings of this plugin and can be restored there."
SICH_FEHLEND = "The file is missing %d settings: %s. An incomplete backup is not restored — otherwise the missing values would silently fall back to the factory defaults, with nothing on the page to show it."
SICH_FREMD = "Unknown setting in the file: %s"
SICH_KEINE_DATEI = "No file was selected, or the upload failed."
SICH_KEIN_JSON = "The file is not a valid backup of this plugin."
SICH_LEER = "The file contains no known setting."
SICH_SCHREIBFEHLER = "The settings could not be written."
SICH_UEBERNOMMEN = "Settings restored: %d values taken over."
SICH_WARNUNG = "<b>The file always contains the action token of this installation</b> – without it all fields would look right after restoring and the Miniserver still would not get through. <b>Only with the box ticked</b> does it also contain user name and password of the sensor source, then in plain text. Treat the file like a password: do not post it in a forum and do not attach it to a bug report."
SICH_ZU_GROSS = "The file is larger than allowed — a backup of this plugin is a few kilobytes."
SOLL_MAX = "Target to %"
SOLL_MIN = "Target from %"
STEHT_MIN = "Report a stuck reading after (minutes)"
STEHT_MIN_HILFE = "If a reading does not move at all for this long, the sensor counts as stuck and the STEHT field becomes 1. A frozen sensor delivers perfectly ordinary numbers – just always the same ones, and Loxone never notices, because virtual inputs keep their last value anyway. 0 switches this off."
TABELLE_FELDER = "<b>Path:</b> levels separated by dots, for example <span class='sm-mono'>ch_aisle.0.temp</span>. On the Test tab, “Check sources and paths” tells you which keys actually exist at that point. — <b>fRsi</b> describes how cold the coldest spot in the room gets: 1.0 means as warm as the room air, 0.4 almost as cold as outside. DIN 4108-2 requires at least 0.70 in new buildings; an uninsulated external corner in an older building is below that. If you do not know, leave 0.70. — <b>Target from/to</b> is the humidity range the room should stay in; 0 switches the message off."
TABELLE_HINWEIS = "The „coldest surface“ column is an <b>estimate</b> derived from the fRsi factor, not a measurement. Mould grows from 80 % relative humidity at the surface – long before any water becomes visible."
TAKT = "Interval between fetches (seconds)"
TAKT_HILFE = "Indoor climate changes slowly. 300 seconds is plenty; shorter intervals only burden the sources."
H_ANSAGE = "Speech output (off by default)"
ANSAGE_ERKLAERUNG = "Raumklima can announce by itself when ventilating is recommended in a room or a risk of mould arises – through the shared speech output of the plugins of this house: Loxone Music Server, MusicServer4Home, an own address template, Alexa-NG or Google speakers (Chromecast 4 Lox NG). It speaks once when the state begins, not on every fetch; only when the state ends and begins again does the next announcement follow. With several rooms the sentence names the room. Address and template must be in the home network."
ANSAGE_ANLAESSE = "When to announce"
ANSAGE_LUEFTEN = "Ventilation recommended (per room)"
ANSAGE_SCHIMMEL = "Risk of mould (per room)"
ANSAGE_ANLAESSE_HILFE = "Each occasion can be deselected on its own. By default both boxes are ticked, but the output itself is off: whoever switches it on hears both occasions – a state that already persists is announced once at the next fetch. The quiet time of a room acts on the recommendation itself (except for CO₂), not additionally on the announcement."
ANSAGE_TEST_HINWEIS = "A test announcement is triggered by the button on the %s tab."
SAG_LUEFTEN_EINER = "Room climate: ventilating is recommended."
SAG_LUEFTEN_RAEUME = "Room climate: ventilating is recommended – %s."
SAG_SCHIMMEL_EINER = "Room climate: risk of mould at the coldest spot of the room."
SAG_SCHIMMEL_RAEUME = "Room climate: risk of mould – %s."
SICH_TTS_TOKEN = "The file carries a speech token (%s). A backup of this plugin never contains one – the file is rejected, the current token stays."
SICH_TTS = "Invalid value in the speech output (tts): %s"
SICH_TTS_EINTRAG = "unknown entry “%s” in the speech output block"
SICH_TTS_KEIN_FELD = "the speech output block is not a set of settings"
ANSAGE_RUHE = "Quiet time of announcements: from (HH:MM)"
ANSAGE_RUHE_BIS = "Quiet time of announcements: until (HH:MM)"
ANSAGE_RUHE_HILFE = "Nothing is announced during this time, e.g. 22:00 to 07:00 (across midnight works). A state beginning in the quiet time is noted, but neither spoken nor caught up later. Both fields empty: no quiet time (default). Applies to all rooms, independent of the quiet time of a room."
SICH_ANSAGE_RUHE = "The quiet time of announcements (ansage_ruhe_von/ansage_ruhe_bis) needs both times or none, and they must not be equal."
SICH_ANSAGE_BEHALTEN = "The file comes from a version without speech output; its settings stay as they are."
SICH_OHNE_SPRECHTOKEN = "The speech tokens of the speech output (Alexa-NG, Chromecast 4 Lox NG) are never in the backup; after restoring on another LoxBerry, enter them there again."
T_MIN = "Do not air below ... °C"
T_MIN_HILFE = "In hard frost airing does work, but it costs a lot of heating energy. Where that limit lies is your decision."
T_SOLL = "Target °C"
VERLAUF = "Record history"
VERLAUF_HILFE = "Without history there is only the snapshot. With it the plugin counts the hours above 80 % on the cold surface, checks whether a recommendation actually achieved anything, and estimates the moisture gain per hour. It keeps twelve hours at five-minute resolution and thirty days as hourly means, under <span class='sm-mono'>data/plugins/raumklima/verlauf.json</span>."
VOLUMEN = "Volume m³"
VORSCHAU = "Look-ahead in hours"
ZUG_BENUTZER = "User name"
ZUG_HILFE = "Sent as HTTP basic authentication. Stored in a separate file with permissions 0600, not in the configuration. Currently %d characters are stored. Leaving the field empty means <b>unchanged</b>."
ZUG_LOESCHEN = "Delete credentials"
ZUG_PASSWORT = "Password"
PFAD_ZULUFT = "Path supply air"
WRG_ETA = "Heat recovery %"
WASSER_G = "Laundry g"
RUHE_VON = "Quiet from"
RUHE_BIS = "Quiet until"
WIND_MAX = "Wind limit in km/h"
WIND_MAX_HILFE = "Above this gust speed no ventilation is recommended. For a window drive this is the more important of the two weather reasons — a gust slams the sash, rain does not. <b>0 switches the lock off</b>, and it is off by default: what actuates is not switched on unasked. Wind speed comes from the same Open-Meteo request as temperature and humidity and costs nothing extra; it is not available with your own weather source."
WAND_ABSTAND = "Margin to wall dew point in K"
WAND_ABSTAND_HILFE = "Ventilation is only recommended while the dew point of the <b>outside air</b> stays at least this margin <b>below</b> the coldest surface in the room. Otherwise water condenses exactly there — even when the outside air is drier in absolute terms. This is the summer case in a cellar: 20 °C and 72 % inside, wall 13 °C, outside 25 °C and 51 %. The outside air is 0.70 g/m³ drier, but its dew point of 14.2 °C is 1.2 K above the wall, and the wall would end up at 100 %."
CO2_T_MIN = "CO₂ opens down to °C"
CO2_T_MIN_HILFE = "Below this outside temperature a high CO₂ reading no longer triggers ventilation. Without this separate limit the CO₂ reason bypassed the general cold limit: measured, it opened the window at −18 °C. If fresh air in the bedroom matters more to you, lower the value; −30 switches the limit off entirely."
ZWANG_STD = "Forced ventilation after hours"
ZWANG_STD_HILFE = "If no ventilation conditions were met for this many hours in a row, ventilation is recommended anyway — protecting a building from moisture does not depend on the balance working out at that moment. <b>0 switches forced ventilation off</b>, and it is off by default."
SCHWUEL_X = "Muggy limit in g/kg"
SCHWUEL_X_HILFE = "From this mixing ratio upwards the room air counts as muggy. The measure is water content, not relative humidity: 60 % at 20 °C and 60 % at 28 °C are two entirely different amounts of water. 11.5 g/kg is the usual comfort limit."
VL_ZUSCHLAG = "Margin on the flow limit in K"
VL_ZUSCHLAG_HILFE = "This many kelvin above the dew point is the lowest flow temperature the plugin reports to Loxone. A slow surface cooling system needs a larger margin than a fast fan coil."
KUEHLFREI_EIN = "Cooling release from K"
KUEHLFREI_AUS = "lock again below K"
KUEHLFREI_HILFE = "Two switching points for releasing a surface cooling system, measured on the gap between the coldest surface and the dew point. Two points instead of one, because a single threshold flutters at exactly the place where it matters. The lower point must be below the upper one; otherwise it is not hysteresis but flutter with two names."
HEIZGRENZE = "Heating limit in °C"
HEIZGRENZE_HILFE = "If the running outdoor mean is below this, the plugin reports the heating case, otherwise the cooling case. A single cool August evening does not make a heating case, nor a warm February day a cooling case — the calculation therefore runs over the past days, not the present moment. The value only becomes available once three daily means exist; before that the plugin reports −1, meaning no statement."
TREND_MIN = "Trend window in minutes"
TREND_MIN_HILFE = "The regression line for the humidity trend is fitted over this time window. The trend says which way things are moving right now — unlike the moisture load it needs neither a room volume nor an unventilated stretch, and is therefore available almost always."
SICH_WERT = "Invalid value for %1$s: “%2$s” – %3$s."
SICH_ABRUF_OK = "The readings were fetched again immediately."
SICH_ABRUF_FEHL = "The readings were fetched again immediately — at least one source did not answer. The Test tab says which one."
SICH_OHNE_ZUGANG = "This backup contained NO credentials for the sensor source – they are only included if the box was ticked when saving. User name and password must therefore be entered again on the Settings tab. They are a password for someone else’s device; the move works without them, but until then the source answers with “access denied”."
PERSONEN = "People"
CO2_LTR = "CO₂ per person in l/h"
CO2_AUSSEN = "Outside air in ppm"
CO2_LTR_HILFE = "How much CO₂ a person exhales depends on their activity: asleep about 13 l/h, seated about 17, light work about 25. <b>This is a setting, not a measurement</b> — like fRsi and the air change rate. Together with the number of people per room and the room volume it yields how fast CO₂ rises and what air change rate would be needed to hold the limit. Outside air is around 420 ppm today; the calculation runs against that."
SICH_ZUGANG_HAKEN = "Include the source credentials (the file then contains the password in clear text)"
SICH_MIT_ZUGANG = "The user name and password of the sensor source were contained in the file and have been applied."
SICH_ZUGANG_FEHL = "The credentials from the file could not be written. The remaining settings are in place; please enter user name and password by hand."
H_ASSISTENT = "Setup via the Miniserver"
ASSISTENT_ERKLAERUNG = "If your sensors are already in Loxone, there is nothing to type here. The assistant fetches the <b>room list from the Miniserver</b>, looks for the temperature and humidity block in each room and fills in address and path. Matching goes by <b>room</b>, not by name — tiles tend to be called “Temperature Kitchen” in one room and “Temperature Upstairs Nursery” in the next, whereas the room is unambiguous. The Miniserver’s address and credentials are already known to LoxBerry; you do not enter them twice. <b>The first button writes nothing</b> — it only shows what would happen."
MS_KATEGORIE = "Only from this category"
MS_KATEGORIE_HILFE = "Leave empty to scan all blocks. If you enter part of a category name, only blocks from matching categories are considered — useful when a room holds several temperature values (a sensor and a setpoint, say). Derived flags such as “mould risk” or “ventilation useful” are never proposed anyway."
K_MS_SUCHEN = "Fetch rooms from the Miniserver"
K_MS_UEBERNEHMEN = "Apply the proposal"
MS_GEFUNDEN = "%1$s at %2$s answered: %3$d rooms, %4$d blocks, %5$d rooms with both temperature AND humidity."
MS_FEHLER = "The Miniserver %1$s could not be read: %2$s"
MS_SP_LAGE = "What happens"
MS_WIRD_ANGELEGT = "will be created"
MS_SCHON_DA = "already in the table"
MS_UNVOLLSTAENDIG = "only one of the two values — skipped"
MS_MEHRERE = "%d candidates, the first taken"
MS_VOR_UEBERNAHME = "Only <b>free</b> rows are filled. A room already in the table is left alone, and an occupied row is never overwritten — every search text in Loxone hangs on its number. Type, fRsi, volume and the remaining properties stay at their defaults and still want setting afterwards."
MS_UEBERNOMMEN = "%d room(s) taken over from the Miniserver."
MS_NICHTS_NEU = "Nothing was entered: all rooms found are already in the table, or no row is free any more."
MS_NICHTS_GEFUNDEN = "No room had both temperature <b>and</b> humidity. Check whether the blocks in the Miniserver are assigned to a room — without a room the assistant cannot match them."
MS_KEINER_LANG = "LoxBerry does not know any Miniserver. Enter it under <i>System, Miniserver</i>; this plugin will then find it by itself."
MS_ZUGANG_GESETZT = "The Miniserver credentials were taken over as source credentials — without them it answers with “access denied”."
MS_KATEGORIE_BEISPIEL = "Shelly"
MS_PROBE_OK_T = "Temperature probe on <b>%1$s</b> (%2$s): the Miniserver returns <b>%3$s</b>, read from it <b>%4$s</b>. The path is <b>%5$s</b> — read off your own installation, not assumed. Applies to all blocks of type <i>%6$s</i>."
MS_PROBE_OK_RF = "Humidity probe on <b>%1$s</b> (%2$s): the Miniserver returns <b>%3$s</b>, read from it <b>%4$s</b>. The path is <b>%5$s</b> — probed in its own right, not copied from the temperature block. Applies to all blocks of type <i>%6$s</i>."
MS_PROBE_FEHL2 = "The probe on %1$s failed: %2$s. Blocks of this type are not entered."
MS_MEHRDEUTIG = "several candidates — narrow the category"
MS_KEIN_PLATZ = "no free row left"
MS_MEHRDEUTIG_N = "%d room(s) were skipped because several blocks qualify there. The plugin cannot know which one is right — enter part of a category name above (on a Shelly installation, say “Shelly”) and fetch the list again."
MS_KEIN_PLATZ_N = "%1$d room(s) no longer fit: the table holds %2$d rows and the remaining ones are occupied. If you need more, free a row first."
MS_ZUGANG_FREMD = "The secrets file already held a different account (“%1$s”); the Miniserver identifies itself as “%2$s”. Nothing was overwritten — if the credentials do not match the Miniserver, every fetch is answered with “access denied”."
QUELLE_RF = "Address humidity"
SICH_RAUMFELD = "Invalid value in room %1$d, field %2$s: “%3$s” – %4$s."
SICH_RAUMFELD_KURZ = "raeume (room %1$d, %2$s)"
SICH_LAENGE = "(%d characters)"
SICH_KUEHLFREI = "The switch-off threshold of the cooling release (kuehlfrei_aus) lies above the switch-on threshold (kuehlfrei_ein)."
SICH_TOKEN_BEHALTEN = "The file carried an empty action token. The existing action token of this installation stays valid – the addresses in Loxone keep working."
SICH_TOKEN_NEU = "The file carried an empty action token, and none had been issued here yet. A new one is created the next time the tab “Integration into Loxone” is opened; enter the addresses in Loxone again afterwards."
SICH_WARNKOPF = "Caution: restoring would reject this file because stored values fail the check (%s). Please correct the values in the interface, save and back up again."
SICH_ALTWERT = "Caution: a backup made now would be rejected when restored – stored values fail the check: %s. It is still delivered in full (marked “_warnung”); please correct the values above and save."

