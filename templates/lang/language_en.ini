H_S6 = "Step 6: the counter-check"
S6 = "In Loxone Config look at the live view of <span class='sm-mono'>%1$s</span> – the value goes up every %2$d s. If it stands still, check “Publish values via MQTT” in the MQTT tab and the gateway’s autostart, then step 2 (subscription or ticks). Then compare a number in Loxone with the same value in the Test tab (“Check MQTT and publish”); if both agree, the integration holds."
