ZU_ABRUF_ALT = "1800 seconds are six fetches. The threshold sits deliberately far above the 300-second cycle – a single missed run must not raise a message. The reset point at 900 keeps the message from chattering around the threshold."
ZU_SCHIMMEL = "Mould does not grow out of one minute above 80 %. The four hours keep every shower from raising a message."
ZU_ODER = "Every fault source runs together through a chain of ORs with two inputs each; only the output of the last one (%s) goes on. That is not cosmetics: the notification block only fires on the change from off to on, and a permanently active source wired straight to its input swallows all the others."
