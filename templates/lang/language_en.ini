BE_NUR_ODER = "only the output of %s"
BE_AUS_VORLAGE = "comes from the import file"
ZU_ABRUF_ALT = "1800 seconds are six fetches. The threshold sits deliberately far above the 300-second cycle – a single missed run must not raise a message. The reset point at 900 keeps the message from chattering around the threshold."
ZU_SCHIMMEL = "Mould does not grow out of one minute above 80 %. The four hours keep every shower from raising a message."
ZU_ODER = "Every fault source runs together through <b>one</b> OR. That is not cosmetics: the notification block only fires on the change from off to on, and a permanently active source wired straight to its input swallows all the others."
ZU_BENACHR = "Only the output of the OR reaches the input – never several sources directly."
ZU_VLMIN = "Only useful with surface cooling. <span class='sm-mono'>VLMIN</span> is the room’s dew point plus one kelvin: if the cooling circuit goes below it, water condenses on the surface. Wired in as the lower limit of the flow temperature, the problem is gone."
B_UND = "AND"
BN_SPERRE = "No lock %s"
BN_FREIGABE = "Open window %s"
BE_FREIGABE = "Input 1: %1$s, input 2: %2$s"
BN_ZAEHLER_STEHT = "Fetch has stopped"
BP_ZAEHLER = "The counter wraps 0 to 999; a block checking for a standstill reports a dead fetch even when the clock has jumped."
ZU_FREIGABE = "Only this AND actually drives the window. The recommendation alone is not enough — a hard lock for rain, storm or imminent condensation on the cold surface must <b>not</b> be present at the same time."
ZU_ZAEHLER = "A timestamp alone is not enough as a sign of life: a Raspberry without a buffered clock jumps at the first time sync, and any age computed from it is useless afterwards. A wrapping counter is not."

