BP_ABRUF_ALT = "On above 1800, off below 900"
BP_RAUM_STUMM = "On above 1800, off below 900"
BP_KEINE = "none"
BP_SCHIMMEL = "delay 4 hours"
BP_BENACHR = "subject and text as you like"
BP_VLMIN = "as the lower limit of the flow temperature"
