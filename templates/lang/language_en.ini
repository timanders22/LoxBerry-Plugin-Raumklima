SP_RETAIN = "retained"
RETAIN_HILFE = "<b>retained</b> means the broker keeps the last value, so the Miniserver gets it back immediately after a restart. That is how the <b>states</b> go out. <b>Readings with a time reference</b> (temperature, age, timestamps) deliberately go without retain – otherwise a stale value would sit there looking current. The heartbeat (<span class='sm-mono'>lauf_ts</span>, <span class='sm-mono'>zaehler</span>) never: retained it would always say “alive”. Also never retained: what the fetch says about itself (<span class='sm-mono'>ok</span>, <span class='sm-mono'>ohne</span>, <span class='sm-mono'>ampellos</span>) and what becomes wrong through the clock alone (<span class='sm-mono'>steht</span>, <span class='sm-mono'>ruhe</span>, <span class='sm-mono'>zwang</span>) – retained, it would stand there as “all right” forever once the fetch has stopped. If a room’s sensor goes quiet, that room’s states go out without retain – the broker keeps the last measured state; the totals then go without retain as well. Exception: <span class='sm-mono'>kuehlfrei</span> = −1 (cooling release blocked) stays retained, that is the safe direction. Only what has changed is sent; the heartbeat and <span class='sm-mono'>ok</span> every run, the full set every 30 minutes."
RAUMN_HILFE = "<span class='sm-mono'>raumN</span> stands for the room's number, i.e. <span class='sm-mono'>raum1</span>, <span class='sm-mono'>raum2</span> and so on – the slot in the room table (Settings tab); an empty row leaves a gap. A value that does not exist comes as <b>-1</b> (quantities without a sign) or <b>-999</b> (temperatures, dew points, margins, trends); a 0 would be a false statement."
