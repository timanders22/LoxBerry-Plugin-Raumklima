H_S4 = "Step 4: detecting failure"
S4 = "<b>A Virtual Input keeps its last value.</b> That is why an analog value validation sits at <span class='sm-mono'>%1$s</span> with Tmc %2$d s (five fetch intervals, interval now %3$d s), Min 0, Max 999: if the LoxBerry, the MQTT gateway or the plugin’s fetch stops, the counter stops and its output E reports. Remove the tick at ‘En’ in the properties window. <span class='sm-mono'>%4$s</span> is 1 as long as at least one room delivers values. <span class='sm-mono'>%5$s</span> (seconds since the last successful reading) and <span class='sm-mono'>%6$s</span> (per room) are calculated by the plugin itself at every fetch – they grow while the fetch runs but a source stays silent. No age calculation is needed in Loxone. The blocks for it are below (page “Raumklima”)."
H_S5 = "Step 5: the blocks, to rebuild"
S5 = "Three pages as in the LoxBerry plugins sample project: “Raumklima” (is the plugin running, mould, airing), “Raumklima Werte” (everything that is measured and calculated) and “Raumklima Lüften und Kühlen” (window, CO₂, cooling, ventilation unit). If you only monitor, adopt the first one. Work through each page top to bottom: first the Virtual Inputs from step 3, then the blocks. The block search in Loxone Config opens with <b>F5</b>."
