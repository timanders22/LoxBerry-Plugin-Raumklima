BILD_UNTERSCHRIFT_2 = "Page “Raumklima 2” in the LoxBerry plugins sample project: there the list “Raumklima” spans two Config pages, “Raumklima” (image above) and “Raumklima 2” (no. 5, 8, 11, 12, 16, 17, 27–30, 37, 39)."
SCHRITTE_TITEL = "How to adopt this page"
HINWEISE_TITEL = "Notes"
S1_SCHRITT1 = "In the plugin tab “Settings” enter the rooms – easiest with “Fetch rooms from the Miniserver”, then “Apply the proposal” –, enter the location for the outdoor weather, save, “Fetch and calculate now”. Tab “MQTT”: “Publish values via MQTT” is ticked (default); tab “Test” → “Check MQTT and publish”."
S1_SCHRITT2 = "Above, step 2 (subscription or ticks in the MQTT gateway) and step 3: create one Virtual Input per name of the list (Periphery → Virtual Inputs → Virtual Input), name exactly as in the name table (copy button), do not tick “Use as digital input”. The same inputs serve all three pages; there is no import template for them."
S1_SCHRITT3 = "Create the page “Raumklima”. Drag the %1$d Virtual Inputs of the list onto it (no. 1–%1$d), plus the constant 1 (no. %2$d)."
S1_SCHRITT4 = "Create the notification “Meldung Raumklima” (Periphery → Messages → Notification), text as in the list, drag it onto the page. It gets exactly one connection (from no. %d)."
S1_SCHRITT5 = "Create the virtual input “Kühlvorlauf-Sollwert (eigene Quelle)” as a slider (only with surface cooling; otherwise leave out no. %1$d and %2$d)."
S1_SCHRITT6 = "Place the other blocks with the block search (F5), parameters as in the list, connect from top to bottom; OR and AND have two inputs each. At the limiter no. %1$d set “Max” to 25. Value validator no. %2$d: remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise the constant 1 arrives as 0). Status “Raumklima-Zustand”: click “+” four times first (V5–V8), “{RAUM}: Lüftungsgelegenheit” once. The status lines and message texts are in the table and are entered by hand, the line without condition last."
S1_SCHRITT7 = "Save and transfer. Check: “Raumklima-Zustand” shows “läuft – Werte … s alt”; <span class='sm-mono'>%s</span> goes up every 5 minutes."
S1_H_MELDUNG = "The message only comes after 5 minutes of fault; “Lebenszeichen fehlt” (LoxBerry, MQTT gateway or fetch stopped) after 25 minutes at the earliest."
S1_H_UMBAU = "If you built the page from the list up to 0.11.19: remove the connections no. %1$d → no. %2$d and no. %3$d → no. %4$d, set “Max” to 25 at the limiter no. %5$d, then add the rows from no. %6$d on."
S1_H_TOKEN = "After “Generate a new token” renew the address at the container (or fetch the template again – but then draw all connections again)."
S1_H_GRENZE = "Deliberately not in the list: the time stamp status_ts (alter says the same in readable form; no age calculation is needed in Loxone), the optional values raeume, schwuel, zwang and sperre (name table) and a command “measure now” (Raumklima accepts no commands over MQTT)."
ZU_IMPULS = "The on delay %s only lets a fault report that lasts one fetch interval (300 s) – a single outlier reports nothing. Over the Virtual HTTP Input it also swallows the short pulse a threshold switch gives there at every poll."
ZU_MERKER = "The flag provides “air now” in the tree for other pages; on this page it has no receiver."
ZU_STEHT = "If the LoxBerry stops, every input keeps its last value; only the stopped run counter gives it away – that is why the value validator hangs on the same message through the OR %s."
ZU_MINUS1 = "-1 means “no statement” and must not count as “on” – that is why a threshold switch (on 0.5 / off 0.25) sits in front; only 1 switches."
ZU_KORRIDOR = "The OR combines “too humid” and “too dry”; the on delay keeps short excursions (showering, cooking) quiet."
ZU_FENSTER = "FENSTERZU only changes at the next fetch; the two minutes catch a brief opening."
ZU_KUEHL_IMPULS = "The on delay swallows the short pulse the threshold switch gives at every poll – the release at an actuator must not flicker."
S2_SCHRITT1 = "Create the Virtual Inputs of this page as on page “Raumklima” (step 2), names from the name table; do not create an input twice that already exists."
S2_SCHRITT2 = "New page “Raumklima Werte”, drag the %1$d Virtual Inputs of the list onto it (no. 1–%1$d); switch on “Statistics” in the properties window at temperature, humidity, absolute humidity and wall humidity (no. %2$d, %3$d, %4$d, %5$d)."
S2_SCHRITT3 = "Create the notification “Raumklima Feuchtekorridor” (Periphery → Messages → Notification), text as in the list."
S2_SCHRITT4 = "The other blocks via F5; the OR has two inputs. “+”: “{RAUM}: Raumluft” four times, “{RAUM}: Feuchtebilanz” once, “Außenluft” twice, “Raumklima im ganzen Haus” four times. Enter the status lines by hand, the one without condition last."
S2_SCHRITT5 = "Save and transfer. Check: compare temperature and humidity in “{RAUM}: Raumluft” with your own sensor."
S2_H_STRICH = "A value the plugin cannot calculate comes as -1 (quantities without a sign, “no statement”) or -999 (temperatures, dew points, margins, trends); the status blocks catch it with “&lt; 0” or “&lt; -90”."
S2_H_KORRIDOR = "The target range (40–60 %) is set per room in the plugin; the message only comes after 2 hours outside it."
S2_H_HAUS = "The house overview counts all rooms; in the sample with one room it shows 0 or 1."
S3_SCHRITT1 = "In the plugin enter per room what exists: window contact (path), CO₂ sensor, number of persons and room volume, target temperature for cooling, supply air and heat recovery rate of the ventilation unit, laundry amount. Whatever is missing comes as -1 or -999 or stays 0 – the status says so."
S3_SCHRITT2 = "New page “Raumklima Lüften und Kühlen”, drag the %1$d Virtual Inputs of the list onto it (%2$s once more); switch on “Statistics” at %3$s."
S3_SCHRITT3 = "Create two notifications: “Raumklima Fenster schließen” and “Raumklima Lüftungsanlage Vereisung”, text as in the list."
S3_SCHRITT4 = "The other blocks via F5. “+”: “{RAUM}: Lüftungsempfehlung” and “{RAUM}: CO2” twice each, “{RAUM}: Kühlen” once. Enter the status lines by hand, the one without condition last."
S3_SCHRITT5 = "Save and transfer. Check: open the window while “kein Lüften nötig” is shown – after the next fetch and 2 minutes “Fenster schließen” comes."
S3_H_FREIGABE = "No. %d is the release output for a surface cooling (cooling ceiling, floor cooling); together with the limiter on the page “Raumklima” it prevents condensation on the surface."
S3_H_FENSTERKONTAKT = "Without a window contact in the plugin there is no “Fenster schließen” (FENSTER stays -1)."
S3_H_CO2 = "There is deliberately no CO₂ message of its own – CO₂ is already part of the airing recommendation. If you want one anyway: CO2HOCH through its own on delay to its own notification."
HTTP_AUSFALL = "<b>A virtual input keeps its last value.</b> If the plugin or a sensor source goes quiet, the app still shows the last number and everything looks normal. That is why the plugin delivers three values that make it visible: <span class='sm-mono'>ALTER</span> (seconds since the last successful reading), <span class='sm-mono'>R&lt;n&gt;RALTER</span> (seconds since this room’s last valid reading) and <span class='sm-mono'>R&lt;n&gt;STEHT</span> (the reading no longer moves). <span class='sm-mono'>OK</span> is <b>1</b> as soon as at least one room delivers readings and the last successful reading is no older than three times the fetch interval, otherwise 0 – it is a flag, not a counter. <span class='sm-mono'>NOHNE</span> says how many rooms are without readings. The blocks for it are below."
HTTP_GEGENPROBE = "Open the status address above in a browser: lines with numbers must come back, not dashes. Then compare the <b>live view</b> of an input in Loxone Config with the same number in the response line. If both agree, the integration holds. If nothing arrives, check the search text – it carries a semicolon in front of the field name."
