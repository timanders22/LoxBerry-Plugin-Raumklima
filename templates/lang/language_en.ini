SP_BEDEUTUNG = "Meaning"
H_S1 = "Step 1: choose the route"
S1 = "Two routes, usable side by side. <b>MQTT</b> is the standard one: the LoxBerry MQTT Gateway creates the inputs itself and the plugin needs no broker credentials. The <b>virtual input</b> polls the address below instead; that is the right route if you do not run a gateway. Using both gives you the same numbers twice – harmless, but it costs twice the inputs."
H_S2 = "Step 2: the subscription in the MQTT gateway"
S2 = "Only needed on the MQTT route. The subscription and its exact wording are on the <b>MQTT</b> tab; the note there is tied to the gateway version you actually run."
H_S3 = "Step 3: create the virtual inputs"
S3 = "The button below builds a ready-made import file with every input, search text, unit and limit. Read it into Loxone Config under <i>Periphery → Virtual inputs</i>. The tables below stay all the same – they explain what is in the file."
H_NUMMERN = "Which number is which room"
NUMMERN_HILFE = "The number is the <b>row in the table</b> on the Settings tab, not the rank among the filled rows. Clearing a row leaves a gap, and every other room keeps its number. Up to 0.9.8 they shifted up: an input with the search text <span class='sm-mono'>R3TAU=</span> then silently pointed at a different room, and both numbers looked like a dew point."
SP_NUMMER = "Number"
SP_RAUM = "Room"
SP_PRAEFIX = "Prefix in the search text"
KEINE_RAEUME_KURZ = "no room set up yet"
H_S4 = "Step 4: detecting failure"
S4 = "<b>A virtual input keeps its last value.</b> If the plugin or a sensor source goes quiet, the app still shows the last number and everything looks normal. That is why the plugin delivers three values that make it visible: <span class='sm-mono'>ALTER</span> (seconds since the last fetch), <span class='sm-mono'>R&lt;n&gt;RALTER</span> (seconds since this room’s last valid reading) and <span class='sm-mono'>R&lt;n&gt;STEHT</span> (the reading no longer moves). <span class='sm-mono'>OK</span> counts rooms <b>with</b> readings, not configured rooms. The blocks for it are below."
H_S5 = "Step 5: the blocks, to rebuild"
S5 = "Work through it top to bottom: first the inputs from the import file, then the blocks. The block search in Loxone Config opens with <b>F5</b>."
BAUSTEINE_FUER = "Built for the room „%s“ (number %d). The numbers in the „Connect inputs to“ column refer to the rows of this table."
SP_NR = "#"
SP_TYP = "Block (type)"
SP_NAME = "Name (suggestion)"
SP_PARAM = "Parameters"
SP_EING = "Connect inputs to"
ZU = "On %s:"
WEITERE_RAEUME = "For every further room the same blocks again, with its number instead of %d in the input names. Merge the fault signals of all rooms through <b>one</b> OR – never several sources straight into the notification block."
H_S6 = "Step 6: the counter-check"
S6 = "Open the status address above in a browser: lines with numbers must come back, not dashes. Then compare the <b>live view</b> of an input in Loxone Config with the same number in the response line. If both agree, the integration holds. If nothing arrives, check the search text – it carries a semicolon in front of the field name."
