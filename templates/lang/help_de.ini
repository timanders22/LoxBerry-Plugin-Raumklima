; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Raumklima"
K02 = "Das Plugin rechnet aus Temperatur und Feuchte je Raum den Taupunkt, die absolute Feuchte und das Schimmelrisiko und sagt, <b>wann</b> sich Lüften lohnt – nicht nur, <b>ob</b> es gerade lohnt."
K03 = "Warum absolute Feuchte und nicht relative"
K04 = "Draußen 5&nbsp;°C bei 90&nbsp;% relativer Feuchte fühlt sich nass an, enthält aber nur 6,1&nbsp;g Wasser je Kubikmeter. Drinnen 20&nbsp;°C bei 50&nbsp;% sind 8,6&nbsp;g. Die kalte Luft ist also <b>trockener</b> und nimmt beim Aufwärmen Feuchte auf – im Zimmer werden aus ihren 90&nbsp;% rund 34&nbsp;%."
K05 = "Wer nach der relativen Feuchte lüftet, macht es im Winter genau falsch herum. Deshalb vergleicht das Plugin durchgehend Gramm je Kubikmeter."
K06 = "Woher die Messwerte kommen"
K07 = "Das Plugin kennt bewusst keine Sensormarke. Es nimmt <b>jede Adresse, die JSON liefert</b>, und einen <b>Pfad</b> darin – die Ebenen mit Punkten getrennt, zum Beispiel <code>ch_aisle.0.temp</code>. Das funktioniert mit Ecowitt, Shelly, einem Zigbee-Gateway, dem Endpunkt eines anderen LoxBerry-Plugins oder einer selbst erzeugten Datei."
K08 = "Liefert eine einzige Antwort alle Räume – das ist bei Gateways der Normalfall –, trägst du die Adresse einmal oben ein und je Raum nur die beiden Pfade. Sie wird dann pro Abruf <b>einmal</b> geholt, nicht je Raum."
K09 = "Weißt du den Pfad nicht, hilft der Reiter <b>Test</b>: „Quellen und Pfade prüfen“ holt die Antwort und zeigt, welche Schlüssel es an der Stelle tatsächlich gibt, an der dein Pfad abbricht."
K10 = "Die Außenluft und die Vorhersage"
K11 = "Über <b>Open-Meteo</b> kommen Temperatur und Feuchte kostenlos und ohne Konto – und, das ist der Punkt, <b>stündlich für die nächsten Tage</b>. Nur damit lässt sich die eigentlich interessante Frage beantworten: Lohnt es sich, noch zwei Stunden zu warten?"
K12 = "Eine eigene Wetterstation lässt sich stattdessen eintragen. Dann gibt es allerdings nur die Momentaufnahme – und damit genau das, was eine Formel in Loxone auch schon kann."
K13 = "Schimmel: eine Schätzung, die als solche gekennzeichnet ist"
K14 = "Schimmel wächst nicht erst am Taupunkt, sondern ab etwa <b>80&nbsp;% relativer Feuchte an der Oberfläche</b>. Maßgeblich ist deshalb nicht die Raumluft, sondern die kälteste Wand – und die misst kaum jemand."
K15 = "Das Plugin schätzt sie über den <b>Temperaturfaktor fRsi</b>:"
K16 = "<code>T_Oberfläche = T_außen + fRsi × (T_innen − T_außen)</code>"
K17 = "fRsi&nbsp;=&nbsp;1 wäre eine perfekt gedämmte Wand, 0,4 eine, die fast die Außentemperatur annimmt. Die DIN&nbsp;4108-2 verlangt im Neubau an Wärmebrücken mindestens 0,70; ungedämmte Altbau-Ecken liegen darunter."
K18 = "<b>Das ist eine Einstellung, keine Messung.</b> Wer es genau wissen will, klebt einen Temperaturfühler in die kalte Ecke und trägt ihn als eigenen „Raum“ ein – dann rechnet das Plugin mit dem echten Wert."
K19 = "Wann geraten wird zu lüften"
K20 = "Drei Bedingungen müssen zusammenkommen:"
K21 = "Draußen ist es absolut trockener, und zwar um mindestens den eingestellten Abstand. Ohne diesen Abstand springt die Empfehlung bei jedem Messrauschen hin und her."
K22 = "Es ist nicht zu kalt. Bei −10&nbsp;°C wirkt Lüften zwar, kostet aber viel Heizenergie – wo die Grenze liegt, entscheidest du."
K23 = "Die Raumluft ist nicht schon zu trocken. Im Winter ist das das häufigere Problem, und Lüften macht es schlimmer."
K24 = "Was nach Loxone geht"
K25 = "Zwei Wege, beide gleichzeitig nutzbar:"
K26 = "<b>MQTT</b> – über das MQTT Gateway von LoxBerry, ohne Broker-Zugangsdaten. Der Reiter MQTT listet alle Themen."
K27 = "<b>Virtueller Eingang</b> – der Reiter „Einbindung in Loxone“ erzeugt eine fertige Vorlage zum Import in Loxone Config, mit Adresse und Wortzeichen darin."
K28 = "Werte, die es nicht gibt, werden <b>nicht</b> gesendet und in der Tabelle als Strich gezeigt. Eine 0 wäre eine Falschaussage – bei einer Temperatur sähe sie aus wie eine Messung."
K29 = "Kein VOC — CO₂ dagegen schon"
K30 = "<b>CO₂</b> liest das Plugin seit 0.10.0 als dritten, freiwilligen Pfad je Raum; über der eingestellten Grenze wird gelüftet, auch wenn die Feuchte dagegen spricht. <b>VOC</b> ist bewusst nicht enthalten: sobald jemand VOC-Werte liefert, ist die allgemeine JSON-Quelle der richtige Ort dafür — erfundene Felder ohne Fühler helfen niemandem."
K31 = "Wann NICHT gelüftet wird, egal was sonst dafür spricht"
K32 = "Drei harte Sperren stehen über allen Gründen — auch über CO₂ und über der Kühlung: <b>Starkregen</b>, <b>Sturm</b> und <b>drohendes Tauwasser an der kältesten Fläche</b>. Die dritte ist die unauffälligste: die Außenluft kann absolut trockener sein und ihr Taupunkt trotzdem über der kalten Wand liegen. Dann fällt genau dort Wasser aus. Das ist der Sommerfall im Keller, und bis 0.10.1 riet das Plugin in dieser Lage zum Lüften."
K33 = "Ruhezeit, Zwangslüftung und der Feuchtestoß"
K34 = "Je Raum lässt sich eine <b>Ruhezeit</b> eintragen; in ihr wird das Fenster nicht empfohlen — außer die Luft ist wirklich verbraucht, dann schlägt CO₂ die Ruhezeit. Umgekehrt sorgt die <b>Zwangslüftung</b> dafür, dass nach einer einstellbaren Zahl von Stunden ohne jede Gelegenheit trotzdem geraten wird: der Feuchteschutz eines Hauses hängt nicht davon ab, dass die Bilanz gerade aufgeht. Beides steht ab Werk auf aus."
K35 = "Erkennt das Plugin einen <b>Feuchtestoß</b>, wie ihn nur eine Wasserquelle im Raum erzeugt — der Anstieg nach dem Duschen —, rät es zum Lüften und hört damit erst auf, wenn die Feuchte wieder unter dem Wert von vorher liegt. Nicht nach einer festen Minutenzahl: das Wasser hängt dann noch an den Fliesen."
K36 = "Lüftungsanlage, Wäsche und Behaglichkeit"
K37 = "Trägst du einen fünften Pfad für die <b>Zulufttemperatur</b> ein, rechnet das Plugin die Rückwärmzahl deiner Lüftungsanlage aus drei Temperaturen. Mit der Rückwärmzahl der Anlage als Angabe kommt die Fortlufttemperatur dazu und damit die Warnung, wenn der Wärmetauscher einzufrieren droht. Beide Felder sind ab Werk leer; ohne sie bleibt die Auskunft leer statt geraten."
K38 = "Mit dem Raumvolumen sagt das Plugin, wie viel Wasser ein Luftwechsel je Stunde <b>austrägt</b> — und mit einer eingetragenen Wäschemenge, wie lange es dauert. Die <b>Schwüle</b> wird am Wassergehalt der Luft gemessen, nicht an der relativen Feuchte: 60 % bei 20 °C und 60 % bei 28 °C sind zwei völlig verschiedene Luftmengen."
K39 = "Woran du merkst, dass der Abruf steht"
K40 = "Ein virtueller Eingang behält seinen letzten Wert, über MQTT mit Retain sogar über jeden Neustart hinweg. Stirbt der Abruf, steht in Loxone also weiter die letzte Zahl — das ist keine fehlende Auskunft, sondern eine Falschaussage. Dagegen gehen drei Werte hinaus: <b>OK</b>, ein <b>Zeitstempel</b> der letzten erfolgreichen Messung und ein <b>Zähler</b>, der 0 bis 999 umläuft. Der Zähler beantwortet, was ein Zeitstempel nicht kann: ein Raspberry ohne gepufferte Uhr springt beim ersten Zeitabgleich, und jedes daraus gerechnete Alter ist danach unbrauchbar. Bleibt der Zähler stehen, ist der Abruf tot."
K41 = "Umzug auf einen zweiten LoxBerry"
K42 = "Die beiden Knöpfe im Reiter Einstellungen sichern die ganze Konfiguration in eine Datei und spielen sie wieder ein. <b>Die Datei enthält das Aktionstoken dieser Anlage</b> — ohne es stünden nach dem Zurückspielen alle Felder richtig, und der Miniserver käme trotzdem nicht heran. Behandle sie wie ein Passwort. Benutzername und Passwort der Sensorquelle kommen nur mit, wenn du den Haken <i>Zugangsdaten mitsichern</i> setzt; ohne ihn bleiben sie zurück, und die Oberfläche sagt das nach dem Zurückspielen auch."
K43 = "Der Haken „Zugangsdaten mitsichern“"
K44 = "Mit gesetztem Haken steht das Passwort deiner Sensorquelle <b>im Klartext</b> in der heruntergeladenen Datei. Das ist gewollt und für den Umzug bequem — es macht die Datei aber deutlich heikler: sie gehört nicht in ein Forum, nicht an einen Fehlerbericht und nicht in eine Wolke. Der Kopf der Datei sagt in beiden Fällen, was wirklich darin steht, und beim Zurückspielen landen die Zugangsdaten in <b>geheim.json</b>, nicht in der Konfigurationsdatei. Enthält eine Sicherung keine Zugangsdaten, werden vorhandene auf dem Zielsystem <b>nicht</b> gelöscht."
K45 = "Wie viele Menschen sind im Raum?"
K46 = "Trägst du je Raum die übliche <b>Personenzahl</b> ein, rechnet das Plugin, wie schnell CO₂ dort ansteigt und welcher Luftwechsel nötig wäre, um deine Grenze zu halten. Eine Person in einem 30 m³ großen Schlafzimmer erzeugt rund 567 ppm je Stunde; um 1000 ppm gegen 420 ppm Außenluft zu halten, braucht es knapp einen Luftwechsel je Stunde — ein gekipptes Fenster leistet etwa das. Zu zweit reicht es nicht mehr. Ohne Personenzahl bleiben diese Felder leer statt geraten; ab Werk steht dort 0."
K47 = "Zwei Zahlen stehen nebeneinander, und das ist Absicht: der <b>erwartete</b> Anstieg kommt aus Personenzahl und Raumvolumen, der <b>gemessene</b> aus dem Verlauf. Wer beide sieht, erkennt ein gekipptes Fenster (gemessen deutlich kleiner als erwartet) und einen driftenden Fühler. Die Restzeit bis zur Grenze wird aus dem <b>gemessenen</b> Anstieg gerechnet — eine Zahl aus einer Schätzung sähe aus wie eine aus einer Messung."
