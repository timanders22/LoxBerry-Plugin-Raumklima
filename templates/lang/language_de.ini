BP_VEREIST_MELD = "Text: Raumklima – der Wärmetauscher der Lüftungsanlage droht einzufrieren (Fortluft unter 0 °C). Frostschutz bzw. Vorheizregister der Anlage prüfen"
BN_KUEHLFREI_SWS = "{RAUM}: Flächenkühlung frei"
