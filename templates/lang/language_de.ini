H_S4 = "Schritt 4: Ausfallerkennung"
S4 = "<b>Ein virtueller Eingang behält seinen letzten Wert.</b> Schweigt das Plugin oder eine Sensorquelle, steht in der App weiter die letzte Zahl, und alles sieht normal aus. Deshalb liefert das Plugin drei Werte, die genau das sichtbar machen: <span class='sm-mono'>ALTER</span> (Sekunden seit dem letzten Abruf), <span class='sm-mono'>R&lt;n&gt;RALTER</span> (Sekunden seit dem letzten gültigen Wert dieses Raums) und <span class='sm-mono'>R&lt;n&gt;STEHT</span> (der Wert bewegt sich nicht mehr). <span class='sm-mono'>OK</span> zählt Räume <b>mit</b> Werten, nicht eingetragene Räume. Die Bausteine dazu stehen unten."
