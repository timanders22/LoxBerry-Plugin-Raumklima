NT_FEHLT = "fehlt der Wert"
NT_KOPIEREN = "Kopieren"
NT_SEITE = "Musterseite"
NT_TEXT = "Text"
NT_ZAHL = "Zahl"
NT_BEREICH = "%1$s bis %2$s"
NT_BEREICH_EINHEIT = "%1$s, %2$s bis %3$s"
NT_FEHLT_HILFE = "Spalte „fehlt der Wert“: so kommt ein Wert, den das Plugin nicht rechnen kann (Fühler stumm, Außenwerte fehlen, nichts eingetragen) – <span class='sm-mono'>-1</span> bei Größen ohne Vorzeichen, <span class='sm-mono'>-999</span> bei Temperaturen, Taupunkten, Abständen und Trends, wo -1 ein gewöhnlicher Wert wäre. Die Status der Musterseiten fangen beides ab (Bedingung „&lt; 0“ bzw. „&lt; -90“)."
NT_BESTAND_TITEL = "Weitere Themen für bestehende Anlagen"
NT_BESTAND_TEXT = "Diese Themen sendet das Plugin weiter, damit bestehende Anlagen nichts verlieren. Für eine neue Einbindung werden sie nicht gebraucht und stehen nicht in der Hakenliste."
HTTP_TITEL = "Bestehende Anlagen: Weg über den Virtuellen HTTP-Eingang"
HTTP_TEXT = "Der bisherige Weg bleibt: ein Virtueller HTTP-Eingang holt die Werte im Takt von der Status-Adresse unten; der Knopf erzeugt eine fertige Importdatei mit allen Eingängen, Suchtexten, Einheiten und Grenzen (Loxone Config: <b>Peripherie → Virtueller Eingang → Vorlage importieren</b>). Für eine neue Einbindung ist er nicht nötig. Seit 0.11.21 kommt ein fehlender Wert auch hier als -1 bzw. -999 statt als Strich; wer die Vorlage vor 0.11.21 importiert hat, importiert sie neu (Untergrenzen -1 bzw. -999)."
HTTP_H_AUSFALL = "Ausfallerkennung über HTTP"
HTTP_H_GEGENPROBE = "Gegenprobe über HTTP"
B_FELD_MQTT = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin Raumklima)"
S1_H_HTTP = "Wer die Seite mit dem Virtuellen HTTP-Eingang „Raumklima“ gebaut hat, kann dabei bleiben (Abschnitt „Bestehende Anlagen“ unten). Umstieg: je Zeile den Virtuellen Eingang mit dem Namen aus der Tabelle anlegen und an Stelle des HTTP-Befehls an dieselben Bausteine legen; Tmc der Analogwertvalidierung auf 1500 s."

