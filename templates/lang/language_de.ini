WIND_MAX = "Windgrenze in km/h"
WIND_MAX_HILFE = "Oberhalb dieser Böengeschwindigkeit wird nicht zum Lüften geraten. Für einen Fensterantrieb ist das der wichtigere der beiden Wettergründe — die Böe schlägt den Flügel, der Regen nicht. <b>0 schaltet die Sperre ab</b>, und ab Werk steht sie aus: was schaltet, wird nicht ungefragt eingeschaltet. Die Windgeschwindigkeit kommt aus derselben Open-Meteo-Anfrage wie Temperatur und Feuchte und kostet nichts extra; mit einer eigenen Wetterquelle steht sie nicht zur Verfügung."
WAND_ABSTAND = "Abstand zum Wandtaupunkt in K"
WAND_ABSTAND_HILFE = "Gelüftet wird nur, solange der Taupunkt der <b>Außenluft</b> um mindestens diesen Abstand <b>unter</b> der kältesten Fläche im Raum liegt. Sonst fällt genau dort Wasser aus — auch dann, wenn die Außenluft absolut trockener ist. Das ist der Sommerfall im Keller: 20 °C und 72 % innen, Wand 13 °C, draußen 25 °C und 51 %. Die Außenluft ist um 0,70 g/m³ trockener, ihr Taupunkt liegt aber mit 14,2 °C um 1,2 K über der Wand, und an der Wand wären es danach 100 %."
CO2_T_MIN = "CO₂ öffnet bis Grad"
CO2_T_MIN_HILFE = "Unterhalb dieser Außentemperatur löst ein hoher CO₂-Wert <b>kein</b> Lüften mehr aus. Ohne diese eigene Grenze lief der CO₂-Grund an der allgemeinen Kältegrenze vorbei: gemessen öffnete er das Fenster bei −18 °C. Wer im Schlafzimmer Frischluft über alles stellt, setzt den Wert herunter; −30 schaltet die Grenze ganz ab."
ZWANG_STD = "Zwangslüftung nach Stunden"
