H_S1 = "Schritt 1: den Weg festlegen"
S1 = "Zwei Wege, beide gleichzeitig nutzbar. <b>MQTT</b> ist der Regelweg: das MQTT Gateway von LoxBerry legt die Eingänge selbst an, und das Plugin braucht keine Broker-Zugangsdaten. Der <b>virtuelle Eingang</b> holt die Werte stattdessen im Takt von der Adresse unten; er ist der richtige Weg, wenn du kein Gateway betreibst. Wer beides nutzt, bekommt dieselben Zahlen zweimal – das schadet nicht, kostet aber doppelt Eingänge."
