TABELLE_FELDER = "<b>Pfad:</b> die Ebenen mit Punkten getrennt, zum Beispiel <span class='sm-mono'>ch_aisle.0.temp</span>. Im Reiter Test sagt dir „Quellen prüfen“, welche Schlüssel es an der Stelle wirklich gibt. — <b>fRsi</b> beschreibt, wie kalt die kälteste Stelle im Raum wird: 1,0 heißt so warm wie die Raumluft, 0,4 fast so kalt wie draußen. Die DIN 4108-2 verlangt im Neubau mindestens 0,70; eine ungedämmte Außenecke im Altbau liegt darunter. Wenn du es nicht weißt, lass 0,70 stehen. — <b>Soll von/bis</b> ist der Feuchtekorridor, in dem der Raum liegen soll; 0 schaltet die Meldung ab."
TABELLE_HINWEIS = "Die Spalte „kälteste Fläche“ ist eine <b>Schätzung</b> aus dem Faktor fRsi, keine Messung. Ab 80 % relativer Feuchte an der Oberfläche wächst Schimmel – lange bevor irgendwo Wasser sichtbar wird."
