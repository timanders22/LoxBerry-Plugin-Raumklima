H_S4 = "Schritt 4: Ausfallerkennung"
S4 = "<b>Ein Virtueller Eingang behält seinen letzten Wert.</b> Deshalb eine Analogwertvalidierung an <span class='sm-mono'>%1$s</span> mit Tmc %2$d s (fünf Abruftakte, Takt jetzt %3$d s), Min 0, Max 999: steht der LoxBerry, das MQTT-Gateway oder der Abruf des Plugins, bleibt der Zähler stehen, und ihr Ausgang E meldet. Haken bei ‚En‘ im Eigenschaftsfenster entfernen. <span class='sm-mono'>%4$s</span> ist 1, solange mindestens ein Raum Werte liefert. <span class='sm-mono'>%5$s</span> (Sekunden seit der letzten erfolgreichen Messung) und <span class='sm-mono'>%6$s</span> (je Raum) rechnet das Plugin bei jedem Abruf selbst – sie wachsen, solange der Abruf läuft, aber eine Quelle schweigt. Eine Altersrechnung in Loxone ist nicht nötig. Die Bausteine dazu stehen unten (Seite „Raumklima“)."
H_S5 = "Schritt 5: die Bausteine, zum Nachbauen"
S5 = "Drei Seiten wie im LoxBerry-Plugins Musterprojekt: „Raumklima“ (läuft das Plugin, Schimmel, Lüften), „Raumklima Werte“ (alles, was gemessen und gerechnet wird) und „Raumklima Lüften und Kühlen“ (Fenster, CO₂, Kühlung, Lüftungsanlage). Wer nur überwacht, übernimmt die erste. Jede Seite von oben nach unten abarbeiten: zuerst die Virtuellen Eingänge aus Schritt 3, danach die Bausteine. Die Baustein-Suche in Loxone Config öffnest du mit <b>F5</b>."
