ERKLAERUNG = "Seit LoxBerry 3 ist das MQTT Gateway ein Systembestandteil. Das Plugin schickt seine Werte an dessen UDP-Eingang und braucht deshalb <b>keine</b> Broker-Zugangsdaten. Die Werte erscheinen dann unter dem eingestellten Thema; in Loxone nimmt sie je ein Virtueller Eingang mit dem Namen aus der Namenstabelle auf (Reiter „Einbindung in Loxone“, Schritt 3)."
