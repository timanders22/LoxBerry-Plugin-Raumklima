BN_KUEHLFREI_EVZ = "{RAUM}: Kühlfreigabe bestätigt"
BP_KUEHLFREI_EVZ = "60 s (schluckt den kurzen Impuls von %s bei jeder Abfrage); Ausgang Q an die Freigabe der eigenen Flächenkühlung (nicht Teil der Liste)"
BILD_UNTERSCHRIFT_2 = "Seite „Raumklima 2“ im LoxBerry-Plugins Musterprojekt: dort liegt die Liste „Raumklima“ auf zwei Config-Seiten, „Raumklima“ (Bild oben) und „Raumklima 2“ (Nr. 5, 8, 11, 12, 16, 17, 27–30, 37, 39)."
SCHRITTE_TITEL = "So übernehmen Sie diese Seite"
HINWEISE_TITEL = "Hinweise"
S1_SCHRITT1 = "Im Plugin Reiter „Einstellungen“ die Räume eintragen – am einfachsten „Räume vom Miniserver holen“, dann „Vorschlag übernehmen“ –, Standort für das Außenwetter eintragen, speichern, „Jetzt abrufen und rechnen“. Reiter „MQTT“: „Werte über MQTT veröffentlichen“ ist angehakt (ab Werk); Reiter „Test“ → „MQTT prüfen und senden“."
S1_SCHRITT2 = "Oben Schritt 2 (Abo bzw. Haken im MQTT-Gateway) und Schritt 3: je Name der Liste einen Virtuellen Eingang anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang), Name genau wie in der Namenstabelle (Kopierknopf), „Als Digitaleingang verwenden“ nicht anhaken. Dieselben Eingänge dienen allen drei Seiten; eine Importvorlage gibt es dafür nicht."
S1_SCHRITT3 = "Seite „Raumklima“ anlegen. Die %1$d Virtuellen Eingänge der Liste daraufziehen (Nr. 1–%1$d), dazu die Konstante 1 (Nr. %2$d)."
S1_SCHRITT4 = "Benachrichtigung „Meldung Raumklima“ anlegen (Peripherie → Mitteilungen → Benachrichtigung), Text wie in der Liste, auf die Seite ziehen. Sie bekommt genau eine Leitung (von Nr. %d)."
S1_SCHRITT5 = "Virtuellen Eingang „Kühlvorlauf-Sollwert (eigene Quelle)“ als Schieberegler anlegen (nur mit Flächenkühlung; sonst Nr. %1$d und %2$d weglassen)."
S1_SCHRITT6 = "Übrige Bausteine über die Baustein-Suche (F5) setzen, Parameter wie in der Liste, von oben nach unten verbinden; ODER und UND haben je zwei Eingänge. Am Begrenzer Nr. %1$d „Max“ auf 25 stellen. Analogwertvalidierung Nr. %2$d: Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an). Status „Raumklima-Zustand“: vorher viermal „+“ (V5–V8), „{RAUM}: Lüftungsgelegenheit“ einmal. Die Statuszeilen und Mitteilungstexte stehen in der Tabelle und werden von Hand eingetragen, die Zeile ohne Bedingung zuletzt."
S1_SCHRITT7 = "Speichern und übertragen. Probe: „Raumklima-Zustand“ zeigt „läuft – Werte … s alt“; <span class='sm-mono'>%s</span> zählt alle 5 Minuten weiter."
S1_H_MELDUNG = "Die Meldung kommt erst nach 5 Minuten Störung; „Lebenszeichen fehlt“ (LoxBerry, MQTT-Gateway oder Abruf steht) frühestens nach 25 Minuten."
S1_H_UMBAU = "Wer die Seite nach der Liste bis 0.11.19 gebaut hat: die Leitungen Nr. %1$d → Nr. %2$d und Nr. %3$d → Nr. %4$d entfernen, am Begrenzer Nr. %5$d „Max“ auf 25 stellen, dann die Zeilen ab Nr. %6$d ergänzen."
S1_H_TOKEN = "Nach „Neues Wortzeichen erzeugen“ die Adresse am Behälter erneuern (oder die Vorlage neu holen – dann aber alle Leitungen neu ziehen)."
S1_H_GRENZE = "Bewusst nicht in der Liste: der Zeitstempel status_ts (alter sagt dasselbe lesbar; eine Altersrechnung in Loxone ist nicht nötig), die wahlweisen Werte raeume, schwuel, zwang und sperre (Namenstabelle) und ein Befehl „Jetzt messen“ (Raumklima nimmt über MQTT keine Befehle an)."
ZU_IMPULS = "Die Einschaltverzögerung %s lässt nur eine Störung melden, die einen Abruftakt (300 s) lang anhält – ein einzelner Ausreißer meldet nichts. Über den Virtuellen HTTP-Eingang schluckt sie auch den kurzen Impuls, den ein Schwellwertschalter dort bei jeder Abfrage gibt."
ZU_MERKER = "Der Merker stellt „jetzt lüften“ im Baum für andere Seiten bereit; auf dieser Seite hat er keinen Abnehmer."
ZU_STEHT = "Steht der LoxBerry, behalten alle Eingänge ihren letzten Wert; nur der stehende Laufzähler verrät es – deshalb hängt die Analogwertvalidierung über das ODER %s an derselben Meldung."
ZU_MINUS1 = "-1 heißt „keine Aussage“ und darf nicht als „ein“ zählen – deshalb steht ein Schwellwertschalter (Ein 0,5 / Aus 0,25) davor; nur 1 schaltet."
ZU_KORRIDOR = "Das ODER fasst „zu feucht“ und „zu trocken“ zusammen; die Einschaltverzögerung lässt kurze Ausflüge (Duschen, Kochen) still."
ZU_FENSTER = "FENSTERZU springt erst beim nächsten Abruf; die zwei Minuten fangen kurzes Öffnen ab."
ZU_KUEHL_IMPULS = "Die Einschaltverzögerung schluckt den kurzen Impuls, den der Schwellwertschalter bei jeder Abfrage gibt – die Freigabe an einem Aktor darf nicht flackern."
S2_SCHRITT1 = "Die Virtuellen Eingänge dieser Seite wie auf Seite „Raumklima“ (Schritt 2) anlegen, Namen aus der Namenstabelle; einen Eingang, den es schon gibt, nicht doppelt anlegen."
S2_SCHRITT2 = "Neue Seite „Raumklima Werte“, die %1$d Virtuellen Eingänge der Liste daraufziehen (Nr. 1–%1$d); an Temperatur, Feuchte, absoluter Feuchte und Wandfeuchte (Nr. %2$d, %3$d, %4$d, %5$d) im Eigenschaftsfenster „Statistik“ einschalten."
S2_SCHRITT3 = "Benachrichtigung „Raumklima Feuchtekorridor“ anlegen (Peripherie → Mitteilungen → Benachrichtigung), Text wie in der Liste."
S2_SCHRITT4 = "Übrige Bausteine über F5; das ODER hat zwei Eingänge. „+“: „{RAUM}: Raumluft“ viermal, „{RAUM}: Feuchtebilanz“ einmal, „Außenluft“ zweimal, „Raumklima im ganzen Haus“ viermal. Statuszeilen von Hand eintragen, die ohne Bedingung zuletzt."
S2_SCHRITT5 = "Speichern und übertragen. Probe: Temperatur und Feuchte in „{RAUM}: Raumluft“ mit dem eigenen Fühler vergleichen."
S2_H_STRICH = "Ein Wert, den das Plugin nicht rechnen kann, kommt als -1 (Größen ohne Vorzeichen, „keine Aussage“) bzw. -999 (Temperaturen, Taupunkte, Abstände, Trends); die Status fangen das mit „&lt; 0“ bzw. „&lt; -90“ ab."
S2_H_KORRIDOR = "Der Zielkorridor (40–60 %) wird je Raum im Plugin eingestellt; die Meldung kommt erst nach 2 Stunden außerhalb."
S2_H_HAUS = "Die Haus-Übersicht zählt alle Räume; im Muster mit einem Raum stehen dort 0 oder 1."
S3_SCHRITT1 = "Im Plugin je Raum eintragen, was es gibt: Fensterkontakt (Pfad), CO₂-Fühler, Personenzahl und Raumvolumen, Zieltemperatur zum Kühlen, Zuluft und Rückwärmzahl der Lüftungsanlage, Wäschemenge. Was fehlt, kommt als -1 bzw. -999 oder bleibt 0 – der Status sagt es."
S3_SCHRITT2 = "Neue Seite „Raumklima Lüften und Kühlen“, die %1$d Virtuellen Eingänge der Liste daraufziehen (%2$s ein weiteres Mal); „Statistik“ an %3$s einschalten."
S3_SCHRITT3 = "Zwei Benachrichtigungen anlegen: „Raumklima Fenster schließen“ und „Raumklima Lüftungsanlage Vereisung“, Text wie in der Liste."
S3_SCHRITT4 = "Übrige Bausteine über F5. „+“: „{RAUM}: Lüftungsempfehlung“ und „{RAUM}: CO2“ je zweimal, „{RAUM}: Kühlen“ einmal. Statuszeilen von Hand eintragen, die ohne Bedingung zuletzt."
S3_SCHRITT5 = "Speichern und übertragen. Probe: Fenster öffnen, wenn „kein Lüften nötig“ steht – nach dem nächsten Abruf und 2 Minuten kommt „Fenster schließen“."
S3_H_FREIGABE = "Nr. %d ist der Freigabe-Ausgang für eine Flächenkühlung (Kühldecke, Fußbodenkühlung); zusammen mit dem Begrenzer auf der Seite „Raumklima“ verhindert er Tauwasser an der Fläche."
S3_H_FENSTERKONTAKT = "Ohne Fensterkontakt im Plugin gibt es kein „Fenster schließen“ (FENSTER bleibt -1)."
S3_H_CO2 = "Eine eigene CO₂-Meldung gibt es bewusst nicht – CO₂ steckt schon in der Lüftungsempfehlung. Wer sie trotzdem will: CO2HOCH über eine eigene Einschaltverzögerung an eine eigene Benachrichtigung."
HTTP_AUSFALL = "<b>Ein virtueller Eingang behält seinen letzten Wert.</b> Schweigt das Plugin oder eine Sensorquelle, steht in der App weiter die letzte Zahl, und alles sieht normal aus. Deshalb liefert das Plugin drei Werte, die genau das sichtbar machen: <span class='sm-mono'>ALTER</span> (Sekunden seit der letzten erfolgreichen Messung), <span class='sm-mono'>R&lt;n&gt;RALTER</span> (Sekunden seit dem letzten gültigen Wert dieses Raums) und <span class='sm-mono'>R&lt;n&gt;STEHT</span> (der Wert bewegt sich nicht mehr). <span class='sm-mono'>OK</span> ist <b>1</b>, sobald mindestens ein Raum Werte liefert und die letzte erfolgreiche Messung nicht älter ist als das Dreifache des Abruftakts, sonst 0 – es ist ein Merkmal, kein Zähler. Wie viele Räume ohne Werte sind, sagt <span class='sm-mono'>NOHNE</span>. Die Bausteine dazu stehen unten."
HTTP_GEGENPROBE = "Ruf die Status-Adresse von oben im Browser auf: es müssen Zeilen mit Zahlen kommen, keine Striche. Vergleich dann in Loxone Config die <b>Live-Ansicht</b> eines Eingangs mit derselben Zahl in der Antwortzeile. Stimmen beide überein, trägt die Einbindung. Kommt nichts an, prüf den Suchtext – er enthält ein Semikolon vor dem Feldnamen."
MQ_EIN = "MQTT ist eingeschaltet, Präfix %s."
MQ_AUS = "MQTT ist ausgeschaltet – im Reiter MQTT „Werte über MQTT veröffentlichen“ anhaken, sonst kommt über diesen Weg nichts in Loxone an."
MQ_S2_V2 = "Gateway V2: Unter System → MQTT Gateway → Subscriptions erscheint die Gruppe %s. Diese Datenpunkte anhaken:"
HAKEN_SP_THEMA = "Thema"
HAKEN_SP_NAME = "Name in Loxone"
HAKEN_SP_SEITE = "Musterseite"
HAKEN_ZAHL = "%1$d Datenpunkte (24 + 52 je Raum), davon %2$d auf den Musterseiten."
HAKEN_RESET = "Kein Thema braucht „Noncached“ oder „Zurücksetzen nach Senden“: alle Werte sind Zustände oder Messwerte, das Lebenszeichen ändert sich bei jedem Abruf."
RECONNECT = "Nach einem Neustart des Miniservers schickt das Gateway die Werte erst bei Änderung wieder; der Startimpuls der Musterseite „LoxBerry MQTT-Gateway“ (reconnect) lässt es alles neu senden. Das Lebenszeichen kommt ohnehin bei jedem Abruf, alle übrigen Werte spätestens mit dem vollen Satz alle 30 Minuten."
NT_DIGITAL = "„Als Digitaleingang verwenden“ nicht anhaken – auch nicht bei 0/1-Werten."
NT_RECHTE = "Der LoxBerry-Benutzer am Miniserver braucht Rechte auf diese Eingänge, sonst meldet der Datenverkehr des Gateways Fehler."
NT_MUSTER = "Wer die Seiten des Musterprojekts kopiert, bekommt die Eingänge mit (Präfix raumklima, Raum raum1)."
NT_WEITERE = "Ein weiterer Raum bringt 52 neue Namen (raum2, raum3 …; die Nummer ist der Platz in der Raumtabelle); ein geändertes Präfix ändert alle Namen."
NT_NAME = "Name"
NT_BEDEUTUNG = "Bedeutung"
NT_BEREICH_SP = "Einheit/Bereich"
