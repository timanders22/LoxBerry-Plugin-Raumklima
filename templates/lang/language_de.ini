SP_RETAIN = "retained"
RETAIN_HILFE = "<b>retained</b> heißt: der Broker hält den letzten Wert fest, und der Miniserver bekommt ihn nach einem Neustart sofort wieder. So gehen die <b>Zustände</b> hinaus. <b>Messwerte mit Zeitbezug</b> (Temperatur, Alter, Zeitstempel) gehen bewusst ohne Retain – sonst stünde nach einem Ausfall ein alter Wert da und sähe aus wie ein aktueller. Das Lebenszeichen (<span class='sm-mono'>lauf_ts</span>, <span class='sm-mono'>zaehler</span>) nie: retained zeigte es immer „lebt“. Ebenso nie retained: was der Abruf über sich selbst sagt (<span class='sm-mono'>ok</span>, <span class='sm-mono'>ohne</span>, <span class='sm-mono'>ampellos</span>) und was allein durch die Uhr falsch wird (<span class='sm-mono'>steht</span>, <span class='sm-mono'>ruhe</span>, <span class='sm-mono'>zwang</span>) – zurückbehalten stünde es nach dem Ende des Abrufs für immer als „in Ordnung“ da. Schweigt der Fühler eines Raums, gehen dessen Zustände ohne Retain hinaus – im Broker bleibt der zuletzt gemessene Stand; die Summen gehen dann ebenfalls ohne Retain. Ausnahme: <span class='sm-mono'>kuehlfrei</span> = −1 (Kühlfreigabe gesperrt) bleibt retained, das ist die sichere Richtung. Gesendet wird nur, was sich geändert hat; das Lebenszeichen und <span class='sm-mono'>ok</span> in jedem Lauf, der volle Satz alle 30 Minuten."
RAUMN_HILFE = "<span class='sm-mono'>raumN</span> steht für die Nummer des Raumes, also <span class='sm-mono'>raum1</span>, <span class='sm-mono'>raum2</span> und so weiter – der Platz in der Raumtabelle (Reiter Einstellungen); eine leere Zeile lässt eine Lücke. Ein Wert, den es nicht gibt, kommt als <b>-1</b> (Größen ohne Vorzeichen) bzw. <b>-999</b> (Temperaturen, Taupunkte, Abstände, Trends); eine 0 wäre eine Falschaussage."
