SICH_OHNE_ZUGANG = "Benutzername und Passwort der Sensorquelle sind in einer Sicherung <b>nicht</b> enthalten und müssen im Reiter Einstellungen neu eingetragen werden. Sie sind ein Kennwort für ein fremdes Gerät; der Umzug funktioniert ohne sie, die Quelle antwortet bis dahin aber mit „Zugang abgelehnt“."
