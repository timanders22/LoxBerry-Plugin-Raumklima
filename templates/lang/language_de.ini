KUEHLFREI_EIN = "Kühlfreigabe ab K"
KUEHLFREI_AUS = "wieder sperren unter K"
KUEHLFREI_HILFE = "Zwei Schaltpunkte für die Freigabe einer Flächenkühlung, gemessen am Abstand zwischen kältester Fläche und Taupunkt. Zwei Punkte statt einem, weil ein einzelner Schwellwert an genau der Stelle flattert, an der es darauf ankommt. Die Ausschaltschwelle muss unter der Einschaltschwelle liegen; sonst ist es keine Hysterese, sondern ein Flattern mit zwei Namen."
HEIZGRENZE = "Heizgrenze in Grad"
HEIZGRENZE_HILFE = "Liegt das gleitende Außenmittel darunter, meldet das Plugin den Heizfall, sonst den Kühlfall. Ein einzelner kühler Augustabend macht keinen Heizfall und ein warmer Februartag keinen Kühlfall — gerechnet wird deshalb über die letzten Tage, nicht über den Augenblick. Der Wert steht erst zur Verfügung, wenn drei Tagesmittel beisammen sind; vorher meldet das Plugin −1, also keine Aussage."
TREND_MIN = "Trendfenster in Minuten"
