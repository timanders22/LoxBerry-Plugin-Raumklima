; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "Indoor climate"
K02 = "From temperature and humidity the plugin calculates the dew point, the absolute humidity and the mould risk for each room, and says <b>when</b> airing is worthwhile – not just <b>whether</b> it is worthwhile right now."
K03 = "Why absolute humidity and not relative"
K04 = "Outside, 5&nbsp;°C at 90&nbsp;% relative humidity feels wet but contains only 6.1&nbsp;g of water per cubic metre. Inside, 20&nbsp;°C at 50&nbsp;% is 8.6&nbsp;g. The cold air is therefore <b>drier</b> and takes up moisture as it warms – in the room its 90&nbsp;% becomes about 34&nbsp;%."
K05 = "Anyone who airs by relative humidity gets it exactly backwards in winter. That is why the plugin compares grams per cubic metre throughout."
K06 = "Where the readings come from"
K07 = "The plugin deliberately knows no sensor brand. It takes <b>any address that returns JSON</b> and a <b>path</b> within it – the levels separated by dots, for example <code>ch_aisle.0.temp</code>. That works with Ecowitt, Shelly, a Zigbee gateway, the endpoint of another LoxBerry plugin or a file you generate yourself."
K08 = "If a single reply carries all the rooms – which is the normal case with gateways – you enter the address once at the top and only the two paths per room. It is then fetched <b>once</b> per cycle, not once per room."
K09 = "If you do not know the path, the <b>Test</b> tab helps: „Check sources and paths“ fetches the reply and shows which keys actually exist at the point where your path breaks off."
K10 = "Outside air and the forecast"
K11 = "Through <b>Open-Meteo</b>, temperature and humidity arrive free of charge and without an account – and, this is the point, <b>hourly for the coming days</b>. Only that makes it possible to answer the interesting question: is it worth waiting another two hours?"
K12 = "A weather station of your own can be entered instead. In that case, however, you only get the snapshot – and therefore exactly what a formula in Loxone can already do."
K13 = "Mould: an estimate, marked as one"
K14 = "Mould does not start growing at the dew point but from about <b>80&nbsp;% relative humidity at the surface</b>. What matters is therefore not the room air but the coldest wall – and hardly anyone measures that."
K15 = "The plugin estimates it through the <b>temperature factor fRsi</b>:"
K16 = "<code>T_surface = T_outside + fRsi × (T_inside − T_outside)</code>"
K17 = "fRsi&nbsp;=&nbsp;1 would be a perfectly insulated wall, 0.4 one that almost takes on the outside temperature. DIN&nbsp;4108-2 requires at least 0.70 at thermal bridges in new buildings; uninsulated corners in older buildings are below that."
K18 = "<b>That is a setting, not a measurement.</b> If you want to know for certain, stick a temperature sensor into the cold corner and enter it as a „room“ of its own – then the plugin works with the real value."
K19 = "When airing is advised"
K20 = "Three conditions have to come together:"
K21 = "It is absolutely drier outside, by at least the configured margin. Without that margin the recommendation flips back and forth with every bit of measurement noise."
K22 = "It is not too cold. At −10&nbsp;°C airing does work, but it costs a lot of heating energy – where the limit lies is your decision."
K23 = "The room air is not already too dry. In winter that is the more common problem, and airing makes it worse."
K24 = "What goes to Loxone"
K25 = "Two routes, both usable at the same time:"
K26 = "<b>MQTT</b> – through the LoxBerry MQTT gateway, without broker credentials. The MQTT tab lists all the topics."
K27 = "<b>Virtual input</b> – the „Loxone integration“ tab generates a ready-made template for import into Loxone Config, with the address and the identifiers already in it."
K28 = "Values that do not exist are <b>not</b> sent and are shown as a dash in the table. A 0 would be a false statement – on a temperature it would look like a measurement."
K29 = "No VOC — but CO₂ yes"
K30 = "The plugin has read <b>CO₂</b> since 0.10.0 as a third, optional path per room; above the configured limit it recommends ventilation even when humidity argues against it. <b>VOC</b> is deliberately absent: as soon as somebody supplies VOC readings, the general JSON source is the right place for them — invented fields without a sensor help nobody."
K31 = "When ventilation is refused, whatever else argues for it"
K32 = "Three hard locks override every reason — including CO₂ and cooling: <b>heavy rain</b>, <b>storm</b> and <b>imminent condensation on the coldest surface</b>. The third is the least obvious: the outside air can be drier in absolute terms and its dew point still lie above the cold wall. Water then condenses exactly there. This is the summer case in a cellar, and up to 0.10.1 the plugin recommended ventilation in this situation."
K33 = "Quiet period, forced ventilation and the moisture surge"
K34 = "A <b>quiet period</b> can be set per room; during it the window is not recommended — unless the air is genuinely stale, in which case CO₂ overrides the quiet period. Conversely, <b>forced ventilation</b> makes sure that after a configurable number of hours without any opportunity ventilation is recommended anyway: protecting a building from moisture does not depend on the balance working out right now. Both are off by default."
K35 = "If the plugin detects a <b>moisture surge</b> of the kind only a water source in the room produces — the rise after a shower — it recommends ventilation and stops only when the humidity is back below its earlier level. Not after a fixed number of minutes: the water is still on the tiles then."
K36 = "Ventilation unit, laundry and comfort"
K37 = "If you enter a fifth path for the <b>supply air temperature</b>, the plugin computes your ventilation unit’s heat recovery rate from three temperatures. Given the unit’s rated recovery rate, the exhaust air temperature follows, and with it a warning when the heat exchanger is at risk of freezing. Both fields are empty by default; without them the answer stays empty rather than guessed."
K38 = "Given the room volume the plugin states how much water an air change <b>carries out</b> per hour — and with an entered amount of laundry, how long it takes. <b>Mugginess</b> is measured by the water content of the air, not by relative humidity: 60 % at 20 °C and 60 % at 28 °C are two entirely different amounts of water."
K39 = "How you notice the fetch has stopped"
K40 = "A virtual input keeps its last value, over MQTT with retain even across a restart. So if the fetch dies, Loxone still shows the last figure — that is not a missing answer but a false one. Three values go out against this: <b>OK</b>, a <b>timestamp</b> of the last successful measurement and a <b>counter</b> wrapping 0 to 999. The counter answers what a timestamp cannot: a Raspberry without a buffered clock jumps at the first time sync, and any age computed from it is useless afterwards. If the counter stops, the fetch is dead."
K41 = "Moving to a second LoxBerry"
K42 = "The two buttons on the Settings tab save the whole configuration to a file and read it back. <b>The file contains this installation’s action token</b> — without it every field would be right after restoring and the Miniserver still could not reach the plugin. Treat it like a password. The sensor source’s user name and password are only included if you tick <i>include credentials</i>; without it they stay behind, and the interface says so after restoring."
K43 = "The tick “include credentials”"
K44 = "With the tick set, your sensor source’s password sits <b>in clear text</b> in the downloaded file. That is intended and convenient for a move — but it makes the file considerably more sensitive: it does not belong in a forum, in a bug report or in a cloud. The file’s header states in both cases what it really contains, and on restoring the credentials go into <b>geheim.json</b>, not into the configuration file. If a backup contains no credentials, existing ones on the target system are <b>not</b> deleted."
K45 = "How many people are in the room?"
K46 = "If you enter the usual <b>number of people</b> per room, the plugin computes how fast CO₂ rises there and what air change rate would be needed to hold your limit. One person in a 30 m³ bedroom produces about 567 ppm per hour; holding 1000 ppm against 420 ppm outside air needs just under one air change per hour — roughly what a tilted window delivers. For two people it is no longer enough. Without the number of people these fields stay empty rather than guessed; the default is 0."
K47 = "Two figures stand side by side, and that is deliberate: the <b>expected</b> rise comes from the number of people and the room volume, the <b>measured</b> one from the history. Seeing both reveals a tilted window (measured much lower than expected) and a drifting sensor. The time remaining until the limit is computed from the <b>measured</b> rise — a figure from an estimate would look like one from a measurement."
