[AUTOUPDATE]
# Diese Datei gehoert in das Wurzelverzeichnis des GitHub-Repositories und
# steuert dort das Auto-Update. Seit 0.9.1 steht AUTOMATIC_UPDATES in der
# plugin.cfg auf true, diese Datei wird also wirklich abgerufen - und zwar
# ueber die Adresse, die dort unter PRERELEASECFG steht - nicht unter
# RELEASECFG. Bis 0.11.2 sprach dieser Erklaertext durchgehend von
# RELEASECFG und von release.cfg; Vorsatz und Adresse gingen damit
# auseinander, obwohl beide Dateien Zeichen fuer Zeichen gleich sind.
#
# Bei jedem Release VIER Stellen gleichzeitig anfassen:
#   1. plugin.cfg      -> VERSION
#   2. release.cfg     -> VERSION und BEIDE Adressen auf den neuen Tag
#   3. prerelease.cfg  -> dasselbe (diese Datei)
#   4. auf GitHub ein Release mit genau diesem Tag (vX.Y.Z)
#
# Die plugin.cfg liest DIESE Datei aus dem Zweig master, das ARCHIVEURL zieht
# aber aus dem TAG. Wer hier etwas aendert, ohne den Tag mitzuziehen, liefert
# an neue Installationen weiter den alten Stand aus.
VERSION=0.11.3
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Raumklima/archive/refs/tags/v0.11.3.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Raumklima/releases/tag/v0.11.3
