[AUTOUPDATE]
# Diese Datei gehoert in das Wurzelverzeichnis des GitHub-Repositories und
# steuert dort das Auto-Update. Solange AUTOMATIC_UPDATES in der plugin.cfg
# auf false steht, wird sie nicht abgerufen - sie ist trotzdem schon richtig
# ausgefuellt, damit beim Einschalten nichts vergessen wird.
#
# Bei jedem Release drei Stellen gleichzeitig anfassen:
#   1. plugin.cfg  -> VERSION
#   2. release.cfg -> VERSION und BEIDE Adressen auf den neuen Tag
#   3. auf GitHub ein Release mit genau diesem Tag (vX.Y.Z)
#
# Die plugin.cfg liest DIESE Datei aus dem Zweig master, das ARCHIVEURL zieht
# aber aus dem TAG. Wer hier etwas aendert, ohne den Tag mitzuziehen, liefert
# an neue Installationen weiter den alten Stand aus.
VERSION=0.9.1
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Raumklima/archive/refs/tags/v0.9.1.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Raumklima/releases/tag/v0.9.1
